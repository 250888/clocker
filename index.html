<!DOCTYPE html>
<html>
<head>
  <base href="/clocker/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Clocker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Clocker">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>Clocker</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#08090B; overflow:hidden; }
    #loading-screen {
      position:fixed; top:0; left:0; width:100%; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:
        radial-gradient(120% 70% at 50% 118%, rgba(240,223,192,.10) 0%, rgba(8,9,11,0) 55%),
        linear-gradient(180deg,#08090B 0%,#0A0C10 52%,#101620 88%,#1B2130 100%);
      z-index:9999999;
      transition: opacity 0.5s;
    }
    #loading-screen::after {
      content:""; position:absolute; left:-20%; right:-20%; bottom:-52vh; height:60vh;
      border-radius:50%;
      background:radial-gradient(closest-side at 50% 0%, rgba(255,248,234,.95) 0%, rgba(240,223,192,.5) 3%, rgba(168,120,78,.16) 12%, rgba(4,4,5,.9) 46%);
      box-shadow:0 -2px 26px rgba(255,240,214,.35);
      pointer-events:none;
    }
    #loading-screen.fade-out { opacity:0; pointer-events:none; }
    #loading-screen .logo {
      font-size:20px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      color:#F2EEE4; font-weight:500; letter-spacing:12px; text-indent:12px;
      margin-bottom:14px; position:relative; z-index:1;
    }
    #loading-screen .subtitle {
      font-size:10px; color:rgba(242,238,228,0.42); margin-bottom:44px;
      letter-spacing:5px; text-indent:5px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      position:relative; z-index:1;
    }
    #loading-bar-outer {
      width:200px; height:1.5px; background:rgba(242,238,228,0.14);
      overflow:hidden; position:relative; z-index:1;
    }
    #loading-bar-inner {
      width:0%; height:100%; background:linear-gradient(90deg,#D8B27A,#F0DFC0);
      transition:width 0.3s; box-shadow:0 0 12px rgba(216,178,114,.5);
    }
    #loading-text {
      margin-top:18px; font-size:9.5px; color:rgba(242,238,228,0.34);
      letter-spacing:3px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      position:relative; z-index:1;
    }
    #camera-container {
      position:fixed; bottom:12px; right:12px; width:160px; height:120px;
      z-index:2147483647; border-radius:12px; overflow:hidden;
      box-shadow:0 4px 24px rgba(0,0,0,0.8); border:1px solid rgba(216,178,114,.65);
      display:none; pointer-events:none; background:#08090B;
    }
    #camera-video { width:100%; height:100%; object-fit:cover; display:block; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="logo">CLOCKER</div>
    <div class="subtitle">TIME  DILATION</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
    <div id="loading-text">INITIALIZING</div>
  </div>
  <div id="camera-container">
    <video id="camera-video" autoplay playsinline muted></video>
  </div>

  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(r){
        for(var i=0;i<r.length;i++) r[i].unregister();
      }).catch(function(){});
      if('caches' in window){
        caches.keys().then(function(n){
          for(var i=0;i<n.length;i++) caches.delete(n[i]);
        }).catch(function(){});
      }
    }

    (function(){
      var bar=document.getElementById('loading-bar-inner');
      var txt=document.getElementById('loading-text');
      var pct=0;
      var iv=setInterval(function(){
        pct+=Math.random()*6+2;
        if(pct>85) pct=85;
        bar.style.width=pct+'%';
        if(pct>25) txt.textContent='Loading engine...';
        if(pct>50) txt.textContent='Preparing UI...';
        if(pct>75) txt.textContent='Almost ready...';
      },400);
      window._flutterLoadingProgress=function(p,msg){
        if(p>pct){pct=Math.min(p,95);bar.style.width=pct+'%';}
        if(msg) txt.textContent=msg;
      };
      window._flutterLoadingDone=function(){
        clearInterval(iv);
        bar.style.width='100%';
        txt.textContent='Ready!';
        setTimeout(function(){
          document.getElementById('loading-screen').classList.add('fade-out');
          setTimeout(function(){
            document.getElementById('loading-screen').style.display='none';
          },600);
        },300);
      };
      setTimeout(function(){
        window._flutterLoadingDone();
      },15000);
    })();

    window.startCamera=async function(){
      try{
        var v=document.getElementById('camera-video');
        var c=document.getElementById('camera-container');
        var s=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:false
        });
        v.srcObject=s;
        v.muted=true;
        v.playsInline=true;
        v.setAttribute('playsinline','');
        v.setAttribute('autoplay','');
        c.style.display='block';
        c.style.zIndex='2147483647';
        try{await v.play();}catch(pe){
          console.warn('play() failed, retrying:',pe);
          v.play().catch(function(){});
        }
        console.log('Camera started, video readyState:',v.readyState);
        return true;
      }catch(e){console.warn('Camera:',e);return false;}
    };
    window.stopCamera=function(){
      var v=document.getElementById('camera-video');
      var c=document.getElementById('camera-container');
      if(v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}
      c.style.display='none';
    };
    window.setCameraOpacity=function(v){
      var c=document.getElementById('camera-container');if(c) c.style.opacity=v;
    };
    window.setCameraMirror=function(m){
      var v=document.getElementById('camera-video');if(v) v.style.transform=m?'scaleX(-1)':'scaleX(1)';
    };

    var _ac=null,_ns=null,_ng=null,_nf1=null,_nf2=null;
    function _getAC(){
      if(!_ac) _ac=new(window.AudioContext||window.webkitAudioContext)();
      if(_ac.state==='suspended') _ac.resume();
      return _ac;
    }
    function _mkBuf(ctx){
      var sr=ctx.sampleRate,len=sr*4,buf=ctx.createBuffer(2,len,sr);
      for(var ch=0;ch<2;ch++){var d=buf.getChannelData(ch);for(var i=0;i<len;i++) d[i]=Math.random()*2-1;}
      return buf;
    }
    // ── 程序合成环境音：床层 + 纹理（水滴/噼啪/鸟鸣/杯响），全部烘进一个可循环缓冲 ──
    // ── 环境音：粉噪声基底（1/f 谱）+ 慢速呼吸调制 + 纹理事件 ──
    // 白噪声每赫兹能量相同 → 高频刺耳；粉噪声能量随频率递减，才是自然底色。
    function _buildNoiseBuffer(ctx, sid, seconds){
      var sr=ctx.sampleRate, len=Math.floor(sr*(seconds||8));
      var buf=ctx.createBuffer(2, len, sr);
      for(var ch=0; ch<2; ch++){
        var d=buf.getChannelData(ch);
        // ① 粉噪声（Paul Kellet 滤波器）
        var pink=new Float32Array(len);
        var p0=0,p1=0,p2=0,p3=0,p4=0,p5=0,p6=0;
        for(var i=0;i<len;i++){
          var w=Math.random()*2-1;
          p0=0.99886*p0+w*0.0555179;
          p1=0.99332*p1+w*0.0750759;
          p2=0.96900*p2+w*0.1538520;
          p3=0.86650*p3+w*0.3104856;
          p4=0.55000*p4+w*0.5329522;
          p5=-0.7616*p5-w*0.0168980;
          p6=w*0.115926;
          pink[i]=(p0+p1+p2+p3+p4+p5+p6)*0.11;
        }
        // ② 慢速呼吸调制（~0.35Hz + ~3.5Hz）
        var l1=0,l2=0,env=new Float32Array(len);
        for(var i2=0;i2<len;i2++){
          l1+=(Math.random()*2-1-l1)*0.00008;
          l2+=(Math.random()*2-1-l2)*0.0005;
          env[i2]=Math.max(0.55, Math.min(1.15, 0.85+l1*20+l2*3));
        }
        // ③ 双二阶滤波
        var x1=0,x2=0,y1=0,y2=0,lfo=0,gust=0;
        function bq(type,freq,Q,x0v){
          var w0=2*Math.PI*freq/sr, a=Math.sin(w0)/(2*Q);
          var b0,b1,b2,a0,a1,a2;
          if(type==='lowpass'){b0=(1-Math.cos(w0))/2;b1=1-Math.cos(w0);b2=b0;a0=1+a;a1=-2*Math.cos(w0);a2=1-a;}
          else if(type==='highpass'){b0=(1+Math.cos(w0))/2;b1=-(1+Math.cos(w0));b2=b0;a0=1+a;a1=-2*Math.cos(w0);a2=1-a;}
          else{b0=a;b1=0;b2=-a;a0=1+a;a1=-2*Math.cos(w0);a2=1-a;}
          var y=(b0/a0)*x0v+(b1/a0)*x1+(b2/a0)*x2-(a1/a0)*y1-(a2/a0)*y2;
          x2=x1;x1=x0v;y2=y1;y1=y;
          return y;
        }
        for(var i3=0;i3<len;i3++){
          var x0v=pink[i3], s=0;
          if(sid==='rain'){ s=bq('highpass',180,0.7071,x0v); s=bq('lowpass',9000,0.7071,s); s*=1.9; }
          else if(sid==='fire'){ s=bq('lowpass',420,1.0,x0v); s=bq('lowpass',420,1.0,s); s*=3.6; }
          else if(sid==='ocean'){ lfo+=2*Math.PI/(sr*8); s=bq('lowpass',600+Math.sin(lfo)*320,0.8,x0v); s=bq('lowpass',1600,0.7071,s); s*=(2.2+1.4*Math.sin(lfo*2)); }
          else if(sid==='wind'){ lfo+=2*Math.PI/(sr*11); gust+=2*Math.PI/(sr*19); s=bq('bandpass',380+Math.sin(lfo)*200,0.30,x0v); s=bq('lowpass',2400,0.7071,s); s*=(2.6+1.6*Math.sin(gust)); }
          else if(sid==='forest'){ s=bq('highpass',400,0.7071,x0v); s=bq('lowpass',6000,0.7071,s); s*=1.6; }
          else if(sid==='cafe'){ lfo+=(x0v-lfo)*0.02; s=bq('lowpass',700,0.7071,lfo); s*=9.0; }
          else { s=x0v*0.1; }
          d[i3]=s*env[i3];
        }
        // ④ 纹理事件
        var rnd=function(){return Math.random();};
        var pos=0;
        while(pos<len){
          if(sid==='rain'){
            pos+=Math.floor(sr*0.05+rnd()*sr*0.25);
            var f=2200+rnd()*1600, amp=0.35+rnd()*0.4, L=Math.floor(sr*0.02);
            for(var k=0;k<L&&pos+k<len;k++){ d[pos+k]+=Math.sin(2*Math.PI*f*k/sr)*Math.exp(-9*k/L)*amp; }
          } else if(sid==='fire'){
            pos+=Math.floor(sr*0.02+rnd()*sr*0.12);
            var amp2=0.5+rnd()*0.9, L2=Math.floor(sr*0.012), y=0;
            for(var k2=0;k2<L2&&pos+k2<len;k2++){ y=0.75*y+0.25*(rnd()*2-1); d[pos+k2]+=y*Math.exp(-7*k2/L2)*amp2; }
          } else if(sid==='forest'){
            pos+=Math.floor(sr*0.5+rnd()*sr*1.6);
            var f0=2300+rnd()*900, L3=Math.floor(sr*0.13), amp3=0.25+rnd()*0.2;
            for(var k3=0;k3<L3&&pos+k3<len;k3++){ var xx=k3/L3; f0+=60*(xx>0.5?1:-1); d[pos+k3]+=Math.sin(2*Math.PI*f0*k3/sr)*Math.sin(Math.PI*xx)*(0.6+0.4*Math.sin(2*Math.PI*7*xx))*amp3; }
          } else if(sid==='cafe'){
            pos+=Math.floor(sr*0.6+rnd()*sr*1.8);
            var L4=Math.floor(sr*0.06), amp4=0.2+rnd()*0.25;
            for(var k4=0;k4<L4&&pos+k4<len;k4++){ d[pos+k4]+=Math.sin(2*Math.PI*3100*k4/sr)*Math.exp(-14*k4/L4)*amp4; }
          } else { pos+=sr; }
        }
      }
      return buf;
    }

    var _noiseToken=0, _noiseCache={};
    function _startSynth(ctx,sid,vol){
      var buf=_buildNoiseBuffer(ctx, sid, 8);
      _ns=ctx.createBufferSource(); _ns.buffer=buf; _ns.loop=true;
      _ng=ctx.createGain(); _ng.gain.value=vol;
      _ns.connect(_ng); _ng.connect(ctx.destination); _ns.start(0);
      _ns.__synth=true;
    }
    window.startWhiteNoise=function(sid,vol){
      try{
        var ctx=_getAC();
        if(_ns){try{_ns.stop();}catch(e){}_ns=null;}
        if(_ng){try{_ng.disconnect();}catch(e){}_ng=null;}
        var token=++_noiseToken;
        // 优先真实环境录音资产（CC0 无缝循环 WAV）；异步取不到则程序合成降级
        var cached=_noiseCache[sid];
        if(cached){ _ns=ctx.createBufferSource(); _ns.buffer=cached; _ns.loop=true;
          _ng=ctx.createGain(); _ng.gain.value=vol;
          _ns.connect(_ng); _ng.connect(ctx.destination); _ns.start(0); return true; }
        fetch('assets/assets/audio/'+sid+'.wav').then(function(r){
          if(!r.ok)throw new Error('asset '+r.status);
          return r.arrayBuffer();
        }).then(function(ab){ return ctx.decodeAudioData(ab); }).then(function(buf){
          if(token!==_noiseToken)return;   // 已切换/停止
          _noiseCache[sid]=buf;
          if(_ns){try{_ns.stop();}catch(e){}_ns=null;}
          if(_ng){try{_ng.disconnect();}catch(e){}_ng=null;}
          _ns=ctx.createBufferSource(); _ns.buffer=buf; _ns.loop=true;
          _ng=ctx.createGain(); _ng.gain.value=vol;
          _ns.connect(_ng); _ng.connect(ctx.destination); _ns.start(0);
        })['catch'](function(){
          if(token!==_noiseToken)return;
          try{ _startSynth(ctx,sid,vol); }catch(e){console.warn('Noise synth:',e);}
        });
        return true;
      }catch(e){console.warn('Noise:',e);return false;}
    };

    window.stopWhiteNoise=function(){
      _noiseToken++;   // 作废待取回的资产加载，防止停了又自动播
      try{ if(_ns){_ns.stop();_ns=null;} if(_ng){_ng.disconnect();_ng=null;} }catch(e){}
    };
    window.setNoiseVolume=function(v){ if(_ng){try{_ng.gain.value=v;}catch(e){}} };
    window.isNoisePlaying=function(){return _ns!=null;};

    // ── 音效：暖钟鸣 / 警示 / 成就，均用谐波+包络合成 ──
    window.playChime=function(){
      try{
        var ctx=_getAC();
        var notes=[523.25,659.25,783.99,1046.50], now=ctx.currentTime;
        notes.forEach(function(f, i){
          var vel=1.0-i*0.18, decay=0.45+i*0.12, t0=now+i*0.06;
          var g=ctx.createGain(); g.gain.setValueAtTime(0,t0);
          g.gain.linearRampToValueAtTime(0.22*vel, t0+0.008);
          [[1,1],[2.01,0.32],[3.02,0.14]].forEach(function(h){
            var o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*h[0];
            var hg=ctx.createGain(); hg.gain.value=h[1];
            o.connect(hg); hg.connect(g); o.start(t0);
            o.stop(t0+2.2);
          });
          g.gain.setTargetAtTime(0, t0+0.12, decay*0.5);
          g.connect(ctx.destination);
        });
        return true;
      }catch(e){console.warn('Chime:',e);return false;}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
